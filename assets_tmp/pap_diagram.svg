<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <style>
      .box { fill: #F8FAFC; stroke: #334155; stroke-width: 2; rx: 6; }
      .diamond { fill: #FEF3C7; stroke: #D97706; stroke-width: 2; }
      .text-main { font-family: 'Liberation Sans', sans-serif; font-size: 14px; font-weight: bold; fill: #0F172A; text-anchor: middle; }
      .text-sub { font-family: 'Liberation Mono', monospace; font-size: 12px; fill: #475569; text-anchor: middle; }
      .text-edge { font-family: 'Liberation Sans', sans-serif; font-size: 12px; font-weight: bold; fill: #16A34A; }
      .text-edge-no { font-family: 'Liberation Sans', sans-serif; font-size: 12px; font-weight: bold; fill: #DC2626; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="700" fill="#FFFFFF"/>

  <!-- Start -->
  <rect x="300" y="20" width="200" height="40" rx="20" class="box" fill="#E2E8F0"/>
  <text x="400" y="45" class="text-main">void loop()</text>
  <path d="M 400 60 L 400 90" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Timer Check -->
  <polygon points="400,90 550,120 400,150 250,120" class="diamond"/>
  <text x="400" y="125" class="text-main">now - lastUpdate >= 1000ms?</text>
  
  <!-- Timer Check: NEIN -->
  <path d="M 550 120 L 720 120 L 720 600 L 400 600" stroke="#334155" stroke-width="2" fill="none"/>
  <text x="570" y="110" class="text-edge-no">NEIN (return)</text>

  <!-- Timer Check: JA -->
  <path d="M 400 150 L 400 180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="170" class="text-edge">JA</text>

  <!-- Read Sensors -->
  <rect x="300" y="180" width="200" height="50" class="box"/>
  <text x="400" y="200" class="text-main">Sensoren einlesen</text>
  <text x="400" y="220" class="text-sub">DHT11 (Temp/Hum) &amp; ADC</text>
  <path d="M 400 230 L 400 260" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Rain Check (Phase 3) -->
  <polygon points="400,260 580,300 400,340 220,300" class="diamond" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="400" y="305" class="text-main">Regen > 500 ODER Hum > 90%?</text>
  
  <path d="M 220 300 L 80 300 L 80 330" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="140" y="290" class="text-edge">JA</text>
  <rect x="20" y="330" width="120" height="40" class="box" fill="#FECACA" stroke="#DC2626"/>
  <text x="80" y="355" class="text-main" fill="#991B1B">Phase = 3</text>

  <!-- Hum 78 Check (Phase 2) -->
  <path d="M 400 340 L 400 370" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="360" class="text-edge-no">NEIN</text>
  <polygon points="400,370 520,400 400,430 280,400" class="diamond" fill="#FFEDD5" stroke="#EA580C"/>
  <text x="400" y="405" class="text-main">Hum >= 78%?</text>

  <path d="M 280 400 L 160 400 L 160 430" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="210" y="390" class="text-edge">JA</text>
  <rect x="100" y="430" width="120" height="40" class="box" fill="#FED7AA" stroke="#EA580C"/>
  <text x="160" y="455" class="text-main" fill="#9A3412">Phase = 2</text>

  <!-- Hum 65 Check (Phase 1 / 0) -->
  <path d="M 400 430 L 400 460" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="450" class="text-edge-no">NEIN</text>
  <polygon points="400,460 500,490 400,520 300,490" class="diamond" fill="#FEF3C7" stroke="#D97706"/>
  <text x="400" y="495" class="text-main">Hum >= 65%?</text>

  <!-- Phase 1 -->
  <path d="M 300 490 L 240 490 L 240 520" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="260" y="480" class="text-edge">JA</text>
  <rect x="180" y="520" width="120" height="40" class="box" fill="#FDE68A" stroke="#D97706"/>
  <text x="240" y="545" class="text-main" fill="#92400E">Phase = 1</text>

  <!-- Phase 0 -->
  <path d="M 400 520 L 400 550" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="540" class="text-edge-no">NEIN</text>
  <rect x="340" y="550" width="120" height="40" class="box" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="400" y="575" class="text-main" fill="#075985">Phase = 0</text>

  <!-- Vertical Drop Lines (Collision Free) -->
  <path d="M 80 370 L 80 600" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M 160 470 L 160 600" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M 240 560 L 240 600" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M 400 590 L 400 600" stroke="#334155" stroke-width="2" fill="none"/>
  
  <!-- Horizontal Collector -->
  <path d="M 80 600 L 720 600" stroke="#334155" stroke-width="2" fill="none"/>
  
  <!-- Arrow down to Switch -->
  <path d="M 400 600 L 400 630" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="280" y="630" width="240" height="40" class="box"/>
  <text x="400" y="655" class="text-main">Switch(Phase): Aktoren updaten</text>
</svg>
