name: RainyGuard CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO CLI
        run: pip install platformio

      - name: Verify Project Configuration
        run: |
          echo "Pruefe Konfigurationsdateien..."
          test -f config.h && echo "config.h vorhanden"
          test -f Rainyguard.ino && echo "Firmware-Einstieg vorhanden"
